# Builds the Vitrea OS ISO on GitHub's servers and publishes it as a release, split into
# parts under GitHub's 2 GB per-file limit. Run it from the Actions tab (Run workflow).
name: Build ISO

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2)
        required: true
        default: v1.2
      edition:
        description: "Edition: t2 (Intel Macs with the T2 chip; also boots normal PCs) or standard"
        required: true
        default: t2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Make room on the runner (the ISO build needs ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Build the ISO in an Arch Linux container
        run: |
          flag=""; [ "${{ inputs.edition }}" = "t2" ] && flag="--t2"
          ver="${{ inputs.tag }}"; ver="${ver#v}"
          sudo docker run --rm --privileged -e VITREA_VERSION="$ver" -v "$PWD:/src" -w /src archlinux:base-devel bash -euxo pipefail -c "
            pacman-key --init
            pacman -Syu --noconfirm --needed archiso git
            WORK=/tmp/vitrea-work ./build.sh $flag
          "
          ls -la out/

      - name: Split and checksum
        run: |
          sudo chown -R "$USER" out
          cd out
          iso=$(ls *.iso | head -1)
          sha256sum "$iso" > SHA256SUMS.txt
          split -b 1900M -d -a 1 --numeric-suffixes=1 "$iso" "$iso.part"
          rm "$iso"
          echo "ISO=$iso" >> "$GITHUB_ENV"
          echo "SUM=$(cut -d' ' -f1 SHA256SUMS.txt)" >> "$GITHUB_ENV"
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > notes.md <<NOTES
          ## Vitrea OS $TAG

          - **A calmer look**: real photo wallpapers, neutral grey colours with one accent from the
            wallpaper, plain window buttons, solid menus, new lock and login screens, a quiet boot splash
          - **Undo an update**: installs use btrfs and save a snapshot before every update; pick an
            earlier version from the boot menu if an update breaks something
          - Boot menu lists other systems (Windows, Arch) and starts Vitrea after 5 seconds
          - Macs: Cmd works like Ctrl, Touch Bar and fan settings in Vitrea Style, pinch for all windows
          - Clipboard history (Meta+V), screenshots to Pictures/Screenshots (Meta+Shift+S), drop-down
            terminal (F12), KDE Connect, night light, Vitrea Island in the top bar
          - Fixes the installer on computers with lots of memory (e.g. Mac Pro, MacBook Pro)

          ### Download
          Download **both** \`.part1\` and \`.part2\` into the same folder, then join them:

          **macOS / Linux:**
          \`\`\`bash
          cat $ISO.part1 $ISO.part2 > $ISO
          shasum -a 256 $ISO
          \`\`\`
          **Windows (Command Prompt):**
          \`\`\`
          copy /b $ISO.part1 + $ISO.part2 $ISO
          certutil -hashfile $ISO SHA256
          \`\`\`
          The checksum must be \`$SUM\`. Then write the ISO to a USB stick (KDE ISO Image Writer,
          balenaEtcher or \`dd\`). T2 Macs: see the README's "T2 Macs" section (Secure Boot off).
          NOTES
          R="$GITHUB_REPOSITORY"
          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            # rebuild of an existing release: replace its ISO parts and notes
            gh release view "$TAG" -R "$R" --json assets -q '.assets[].name' | while read -r a; do
              gh release delete-asset "$TAG" "$a" -R "$R" -y
            done
            gh release upload "$TAG" out/*.part1 out/*.part2 out/SHA256SUMS.txt -R "$R"
            gh release edit "$TAG" -R "$R" --title "Vitrea OS $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" out/*.part1 out/*.part2 out/SHA256SUMS.txt -R "$R" \
              --title "Vitrea OS $TAG" --notes-file notes.md --latest
          fi
