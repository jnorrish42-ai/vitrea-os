# Publishes Vitrea's own packages (pkgbuilds/vitrea-desktop, pkgbuilds/vitrea-t2) as a pacman
# repository, hosted as the assets of the "repo" release. Every Vitrea install has
#   [vitrea]  Server = https://github.com/<owner>/<repo>/releases/download/repo
# in /etc/pacman.conf, so a push here shows up in Discover / `sudo pacman -Syu` as an update.
name: Publish Vitrea updates

on:
  push:
    branches: [main]
    paths:
      - 'pkgbuilds/vitrea-desktop/**'
      - 'pkgbuilds/vitrea-t2/**'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitrea-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v4

      - name: Build the packages
        run: |
          useradd -m builder
          export VITREA_PKGVER=$(date -u +%Y.%m.%d.%H%M%S)
          mkdir -p /tmp/repo
          for p in vitrea-desktop vitrea-t2; do
            cp -r "pkgbuilds/$p" "/tmp/build-$p"
            chown -R builder "/tmp/build-$p"
            su builder -c "cd /tmp/build-$p && VITREA_PKGVER=$VITREA_PKGVER makepkg -d --noconfirm"
            cp /tmp/build-$p/$p-[0-9]*.pkg.tar.zst /tmp/repo/
          done
          cd /tmp/repo
          repo-add vitrea.db.tar.gz *.pkg.tar.zst
          # release assets can't be symlinks: pacman fetches vitrea.db / vitrea.files by those names
          for f in vitrea.db vitrea.files; do cp --remove-destination "$(readlink -f $f)" $f; done
          ls -la

      - name: Publish to the "repo" release
        run: |
          R="$GITHUB_REPOSITORY"
          if ! gh release view repo -R "$R" >/dev/null 2>&1; then
            gh release create repo -R "$R" --target "$GITHUB_SHA" --prerelease \
              --title "Vitrea update repository" \
              --notes "Package repository that installed Vitrea systems update from (via Discover or \`sudo pacman -Syu\`). Not an install image: get the ISO from the latest release."
          fi
          cd /tmp/repo
          gh release upload repo -R "$R" --clobber vitrea.db vitrea.db.tar.gz vitrea.files vitrea.files.tar.gz *.pkg.tar.zst
          # drop package files from older builds (after the new database is up, so clients never 404)
          keep=$(ls *.pkg.tar.zst)
          gh release view repo -R "$R" --json assets -q '.assets[].name' | grep '\.pkg\.tar\.zst$' | while read -r a; do
            echo "$keep" | grep -qxF "$a" || gh release delete-asset repo "$a" -R "$R" -y
          done
