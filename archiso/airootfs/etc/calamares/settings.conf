---
modules-search: [ local ]
instances:
- id: kernel
  module: shellprocess
  config: shellprocess_kernel.conf
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - initcpiocfg
  - shellprocess@kernel
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@cleanup
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
branding: vitrea
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
