# Runs in the new system after the boot loader step: also put GRUB at the standard fallback path
# EFI/BOOT/BOOTX64.EFI. Some firmware (e.g. Microsoft Surface) only starts that file from the
# internal drive and ignores the "Vitrea" boot entry. Fails the install if it is missing.
---
dontChroot: false
timeout: 300
script:
    - "grub-install --target=x86_64-efi --efi-directory=/boot/efi --removable --recheck"
    - "test -s /boot/efi/EFI/BOOT/BOOTX64.EFI"
    - "grub-mkconfig -o /boot/grub/grub.cfg"
