---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - sys
    - rfkill
autoLoginGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
    nonempty: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /usr/bin/zsh
    forbidden_names: [ root, live ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-vitrea"
    forbidden_names: [ localhost ]
