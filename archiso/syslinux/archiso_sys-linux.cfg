LABEL arch
TEXT HELP
Start Vitrea OS from this USB/DVD. You can try it and install it from the desktop.
ENDTEXT
MENU LABEL Try or Install Vitrea OS
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G quiet loglevel=3 splash

LABEL archsafe
TEXT HELP
Use this if the screen stays black or garbled.
ENDTEXT
MENU LABEL Vitrea OS (safe graphics)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G nomodeset loglevel=3
